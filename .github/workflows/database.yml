name: Database
# Applies new files in supabase/migrations to the linked Supabase project
# when they land on main. seed.sql is not applied; sample data stays local.
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_ID: nczrjscihxnssuvrshgy
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check secrets are set
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets are not set yet; skipping. See supabase/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: 3.4.0
      - name: Link project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"
